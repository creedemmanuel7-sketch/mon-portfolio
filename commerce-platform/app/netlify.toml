[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888

[functions]
  node_bundler = "esbuild"

# SPA hash : pas de rewrite HTML nécessaire.
# /api/create-checkout est déclaré via Config.path dans la function.
